<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Place Wireframe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: slim left rail (logo slot + 7 destinations), top bar = sidebar toggle + breadcrumb + tools, one calm content column, details in a right aside. */
:root{
  --bg:#fafafa; --surface:#ffffff; --sunken:#f4f4f5; --line:#e4e4e7; --line-strong:#d4d4d8;
  --fg:#18181b; --fg-2:#52525b; --fg-3:#8b8b94; --accent:#18181b; --on-accent:#fafafa;
  --warn-bg:#fef6e7; --warn-fg:#8a5a00; --ok:#1f7a4d; --scrim:rgba(9,9,11,.38);
  --shadow:0 12px 40px rgba(9,9,11,.14);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* type scale */ --t-xs:12px; --t-sm:13px; --t-base:14px; --t-md:16px; --t-lg:20px; --t-xl:28px;
  /* space scale */ --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:10px; --r-sm:7px; --side-w:232px; --top-h:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090b; --surface:#111113; --sunken:#18181b; --line:#27272a; --line-strong:#3f3f46;
  --fg:#f4f4f5; --fg-2:#a1a1aa; --fg-3:#71717a; --accent:#f4f4f5; --on-accent:#09090b;
  --warn-bg:#2a2210; --warn-fg:#e8c170; --ok:#5ec796; --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#111113; --sunken:#18181b; --line:#27272a; --line-strong:#3f3f46;
  --fg:#f4f4f5; --fg-2:#a1a1aa; --fg-3:#71717a; --accent:#f4f4f5; --on-accent:#09090b;
  --warn-bg:#2a2210; --warn-fg:#e8c170; --ok:#5ec796; --scrim:rgba(0,0,0,.6); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--t-base)/1.55 var(--font);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)} .small{font-size:var(--t-sm)} .xs{font-size:var(--t-xs)}

/* shell */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100%;min-height:0}
.app[data-sidebar="closed"]{grid-template-columns:64px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.brand{height:var(--top-h);display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);flex:none}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;font-size:var(--t-md);flex:none}
.brandname{font-weight:600;font-size:var(--t-md);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px;padding:var(--s2) var(--s3);overflow:auto}
.nav a{display:flex;align-items:center;gap:var(--s3);height:40px;padding:0 var(--s3);border-radius:var(--r-sm);color:var(--fg-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunken);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--sunken);color:var(--fg)}
.nav .count{margin-left:auto;font-size:var(--t-xs);color:var(--fg-3)}
.side-foot{margin-top:auto;padding:var(--s4);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s2)}
.proto{border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:var(--t-xs);color:var(--fg-2);display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.app[data-sidebar="closed"] .brandname,.app[data-sidebar="closed"] .nav .label,.app[data-sidebar="closed"] .nav .count,.app[data-sidebar="closed"] .side-foot{display:none}
.app[data-sidebar="closed"] .brand{justify-content:center;padding:0}
.app[data-sidebar="closed"] .nav a{justify-content:center;padding:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:var(--top-h);flex:none;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);border-bottom:1px solid var(--line);background:var(--bg)}
.crumbs{min-width:0;flex:1}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:var(--s1);min-width:0}
.crumbs li{display:flex;align-items:center;gap:var(--s1);min-width:0;white-space:nowrap}
.crumbs li:last-child{min-width:0;flex:0 1 auto}
.crumbs a{color:var(--fg-2);text-decoration:none;padding:2px 6px;border-radius:6px;font-weight:500;overflow:hidden;text-overflow:ellipsis;max-width:22ch;display:block}
.crumbs a:hover{background:var(--sunken);color:var(--fg)}
.crumbs li:last-child span.cur{color:var(--fg);font-weight:600;font-size:var(--t-md);letter-spacing:-.01em;padding:2px 6px;overflow:hidden;text-overflow:ellipsis;max-width:34ch;display:block}
.crumbs .sep{color:var(--fg-3);display:flex}
.crumbs .sep svg{width:14px;height:14px}
.view{flex:1;min-height:0;overflow:auto;padding:var(--s6) var(--s5) var(--s7)}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s6)}
.wrap.narrow{max-width:720px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.pagehead h2{font-size:var(--t-xl);font-weight:600;letter-spacing:-.02em;line-height:1.15}
.pagehead p{margin-top:var(--s1);color:var(--fg-2);max-width:56ch}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:36px;padding:0 var(--s4);border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--sunken);color:var(--fg)}
.btn.icon{width:36px;padding:0}
.btn.sm{height:30px;padding:0 var(--s3);font-size:var(--t-sm)}
.btn.wide{width:100%;height:44px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.langbtn{font-weight:600;font-size:var(--t-xs);width:auto;padding:0 var(--s3);gap:var(--s1)}
.searchbtn{display:flex;align-items:center;gap:var(--s2);height:36px;min-width:min(240px,30vw);padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--fg-3)}
.searchbtn kbd{margin-left:auto;font:500 var(--t-xs) var(--font);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--fg-3)}
.field{display:flex;flex-direction:column;gap:var(--s2)}
.field label{font-weight:500}
.field .help{font-size:var(--t-sm);color:var(--fg-2)}
input[type=text],input[type=search],input[type=password],select{height:40px;width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:0 var(--s3)}
input::placeholder{color:var(--fg-3)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;height:34px;padding:0 var(--s4);color:var(--fg-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.sm button{height:30px;padding:0 var(--s3);font-size:var(--t-sm)}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.chip{height:32px;padding:0 var(--s3);border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 var(--s2);border-radius:6px;background:var(--sunken);color:var(--fg-2);font-size:var(--t-xs);font-weight:500;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.tag.ok{color:var(--ok)}
.switch{position:relative;width:40px;height:24px;border-radius:999px;border:0;background:var(--line-strong);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--on-accent)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5);border-top:1px solid var(--line);min-width:0;text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;color:inherit}
.list>.row:first-child,.row.first{border-top:0}
button.row:hover{background:var(--sunken)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--fg-2);font-size:var(--t-sm);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s3)}
.sectionhead h3{font-size:var(--t-md);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.stat{padding:var(--s5)}
.stat .n{font-size:var(--t-xl);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .l{color:var(--fg-2);margin-top:var(--s1)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s4)}
.mcard{text-align:left;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2);min-height:150px}
.mcard:hover{background:var(--sunken)}
.mcard .title{font-weight:600;font-size:var(--t-md)}
.mcard .meta{color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mcard .foot{margin-top:auto;color:var(--fg-3);font-size:var(--t-sm)}
.check{display:flex;align-items:center;gap:var(--s3)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none;background:transparent;padding:0}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot svg.i{width:12px;height:12px;stroke-width:2.4}
.banner{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) var(--s4);border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn-fg);font-size:var(--t-sm)}
.banner button{margin-left:auto;background:none;border:0;color:inherit;text-decoration:underline;font:inherit;font-size:var(--t-sm)}
.empty{text-align:center;padding:var(--s7) var(--s5);display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.empty h3{font-size:var(--t-lg);font-weight:600}
.empty p{max-width:46ch;color:var(--fg-2)}
.empty .ring{width:64px;height:64px;border-radius:50%;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--fg-3)}
details.more{border-top:1px solid var(--line)}
details.more summary{cursor:pointer;list-style:none;padding:var(--s4) var(--s5);display:flex;align-items:center;justify-content:space-between;font-weight:500;color:var(--fg-2)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary svg{transform:rotate(180deg)}
details.more .inner{padding:0 var(--s5) var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:var(--t-sm);background:var(--sunken);border-radius:6px;padding:2px 6px;word-break:break-all}
.codebox{display:flex;align-items:center;gap:var(--s3);justify-content:space-between;padding:var(--s3) var(--s4);background:var(--sunken);border-radius:var(--r-sm)}
.picked{display:flex;flex-direction:column;gap:var(--s2)}
.picked .item{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--sunken);border-radius:var(--r-sm);min-width:0}
.picked .item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:var(--s3) var(--s5);border-radius:999px;z-index:90;box-shadow:var(--shadow);font-weight:500;display:none;max-width:calc(100% - 32px)}
.toast.on{display:block}

/* chat reader: simple thread like a chat app */
.thread{display:flex;flex-direction:column;gap:var(--s5)}
.msg.user{align-self:flex-end;max-width:78%;background:var(--sunken);padding:var(--s3) var(--s4);border-radius:18px}
.msg.ai{display:flex;gap:var(--s3);line-height:1.7;font-size:var(--t-md)}
.msg.ai .av{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:var(--t-xs);font-weight:600;flex:none;margin-top:2px}
.msg.ai p+p{margin-top:var(--s3)}
.readerbar{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.readerbar h2{font-size:var(--t-lg);font-weight:600;letter-spacing:-.01em;flex:1;min-width:200px}
.memhead{display:flex;flex-direction:column;gap:var(--s2)}
.memhead h2{font-size:var(--t-xl);font-weight:600;letter-spacing:-.02em;line-height:1.15}
.memhead .lead{font-size:var(--t-md);color:var(--fg-2);max-width:60ch}
.bullets{margin:0;padding-left:var(--s5);display:flex;flex-direction:column;gap:var(--s2)}

/* aside + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:none}
.scrim.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:60;display:none;flex-direction:column}
.panel.on{display:flex}
.panel header{height:var(--top-h);display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4) 0 var(--s5);border-bottom:1px solid var(--line);flex:none}
.panel header h3{font-size:var(--t-md);font-weight:600}
.panel .body{padding:var(--s5);overflow:auto;display:flex;flex-direction:column;gap:var(--s5)}
.group h4{margin:0 0 var(--s2);font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3)}
.kv{display:flex;justify-content:space-between;gap:var(--s4);padding:var(--s2) 0;border-top:1px solid var(--line)}
.group .kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--fg-2)}
.modal{position:fixed;left:50%;top:max(6vh,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:70;display:none}
.modal.on{display:block}
.modal .mh{padding:var(--s5) var(--s5) 0;display:flex;flex-direction:column;gap:var(--s1)}
.modal .mh h3{font-size:var(--t-lg);font-weight:600}
.modal .mb{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.modal .mf{padding:0 var(--s5) var(--s5);display:flex;gap:var(--s3);justify-content:flex-end}
.steps{display:flex;gap:var(--s2);font-size:var(--t-xs);color:var(--fg-3)}
.steps b{color:var(--fg);font-weight:600}
.results .row{padding:var(--s3) var(--s4);cursor:default}
.results .grp{padding:var(--s3) var(--s4) var(--s1);font-size:var(--t-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);border-top:1px solid var(--line)}
.results .grp.first{border-top:0}
.results a.grow{text-decoration:none;display:block;min-width:0}
.results a.grow:hover .title{text-decoration:underline}

/* map */
.graphcard{position:relative;overflow:hidden}
svg.graph{display:block;width:100%;height:auto;max-height:62vh}
.edge{stroke:var(--line-strong);stroke-width:1.2}
.node circle{fill:var(--fg);stroke:var(--surface);stroke-width:3}
.node.project circle{fill:var(--surface);stroke:var(--fg);stroke-width:2.5}
.node text{fill:var(--fg);font:500 12px var(--font);text-anchor:middle}
.node{cursor:pointer}
.node:hover circle,.node[aria-pressed="true"] circle{stroke:var(--fg-3);stroke-width:5}
.legend{position:absolute;left:var(--s4);bottom:var(--s3);display:flex;gap:var(--s4);font-size:var(--t-xs);color:var(--fg-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--fg);margin-right:6px;vertical-align:-1px}
.legend i.p{background:var(--surface);border:2px solid var(--fg)}

@media (max-width:860px){
  .app,.app[data-sidebar="closed"]{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .18s;box-shadow:var(--shadow)}
  .app[data-sidebar="open"] .side{transform:none}
  .app[data-sidebar="closed"] .brandname,.app[data-sidebar="closed"] .nav .label{display:inline}
  .view{padding:var(--s5) var(--s4) var(--s7)}
  .stats{grid-template-columns:1fr}
  .searchbtn{min-width:0;width:36px;padding:0;justify-content:center}
  .searchbtn span.t,.searchbtn kbd{display:none}
  .row{padding:var(--s3) var(--s4)}
  .tagopt{display:none}
  .crumbs li:not(:nth-last-child(-n+3)){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  else if(a==="showGuide"){ S.setup[3]=0; go("home"); }
  else if(a==="mapName"){ S.mapName=d.v; render(); notes(); }
  else if(a==="scope"){ S.scope=d.v; document.querySelectorAll("#sc .chip").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.v===S.scope);}); runSearch(); }
  else if(a==="pick"){ var id=d.id; if(S.selected[id]) delete S.selected[id]; else S.selected[id]=1; tg.className="dot"+(S.selected[id]?" done":""); tg.innerHTML=S.selected[id]?ICON("check"):""; updSel(); }
});
document.addEventListener("click",function(e){
  var a=e.target.closest(".crumbs a[data-tab]"); if(a){ S.tab=a.dataset.tab; }
});
document.addEventListener("change",function(e){var el=e.target.closest("[data-act=mapNameSel]");if(el){S.mapName=el.value;render();}});
$("#toggleSide").addEventListener("click",function(){ var a=$("#app"); a.dataset.sidebar=a.dataset.sidebar==="open"?"closed":"open"; });
$("#openSearch").addEventListener("click",searchModal);
$("#openNotes").addEventListener("click",notes);
$("#lockBtn").addEventListener("click",lockScreen);
$("#langBtn").addEventListener("click",function(){ var i=LANGS.map(function(l){return l[0];}).indexOf(S.lang); S.lang=LANGS[(i+1)%LANGS.length][0]; render(); });
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); searchModal(); }
  else if(e.key==="Escape"){ if(!$("#scrim").dataset.locked){ closeModal(); closePanel(); } }
});
addEventListener("hashchange",route);
if(innerWidth<=860) $("#app").dataset.sidebar="closed";
route();
})();
</script>
