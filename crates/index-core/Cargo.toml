[package]
name = "mind-place-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mp-vault-migrate"
path = "src/bin/mp-vault-migrate.rs"
required-features = ["sqlcipher-preview"]

[dependencies]
mind-place-archive = { path = "../archive-core" }
mind-place-state = { path = "../state-core" }
mind-place-security = { path = "../security-core" }
mind-place-documents = { path = "../document-core" }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
zeroize = "1.9.0"
base64.workspace = true
url.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
sqlcipher-preview = ["mind-place-state/sqlcipher-preview", "rusqlite/bundled-sqlcipher-vendored-openssl"]
