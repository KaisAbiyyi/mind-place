[package]
name = "mind-place-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "=0.41.0", features = ["bundled"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fs2.workspace = true
tempfile.workspace = true

zeroize = "1.9.0"

mind-place-security = { path = "../security-core" }

[features]
# Opt-in SQLCipher qualification: the bundled 0.41.x provider requires exact-head
# FTS/WAL/temp, key-lifecycle and Windows acceptance before shipping encrypted vaults.
sqlcipher-preview = ["rusqlite/bundled-sqlcipher-vendored-openssl", "rusqlite/backup"]
