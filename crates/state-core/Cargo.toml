[package]
name = "mind-place-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
