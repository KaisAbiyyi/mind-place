# MP-SEC-12: no advisory ignores, graph exclusions, or per-crate exceptions.
# Policy rationale and distribution obligations: docs/security/supply-chain.md.
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = []
unmaintained = "all"
yanked = "deny"
maximum-db-staleness = "P1D"

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0", "OpenSSL",
]
exceptions = []

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
