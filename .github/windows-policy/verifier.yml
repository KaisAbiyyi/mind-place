# DEPLOYMENT TEMPLATE ONLY. Copy into .github/workflows/ in an independently
# controlled policy repository, never into the target repository's workflows.
name: Independent Windows acceptance
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      fresh:
        description: Require an actual current-source manual native run
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: independent-windows-policy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: windows-policy-authority
    steps:
      - name: Require a pinned policy revision
        env:
          POLICY_COMMIT: ${{ vars.WINDOWS_POLICY_COMMIT }}
        run: '[[ "$POLICY_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ vars.WINDOWS_POLICY_COMMIT }}
          persist-credentials: false
      - name: Mint independent target App token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.WINDOWS_PRODUCT_APP_ID }}
          private-key: ${{ secrets.WINDOWS_PRODUCT_APP_PRIVATE_KEY }}
          owner: KaisAbiyyi
          repositories: mind-place
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read
          permission-administration: read
          permission-checks: write
      - name: Verify without executing target code
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REQUIRE_FRESH: ${{ inputs.fresh || false }}
        run: |
          args=()
          if [ "$REQUIRE_FRESH" = true ]; then args+=(--fresh); fi
          python3 scripts/windows_product_gate.py controller \
            --config .github/windows-policy/config.json "${args[@]}"
