name: MP-8F Cloud Visual Regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/mp8f-visual-smoke.mjs'
      - '.github/workflows/mp8f-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Synthetic desktop and narrow-screen screenshot/keyboard qualification
        run: node scripts/mp8f-visual-smoke.mjs
      - name: Save synthetic screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mp8f-visual-${{ github.sha }}
          path: artifacts/mp8f-visual/
          if-no-files-found: warn
          retention-days: 14
