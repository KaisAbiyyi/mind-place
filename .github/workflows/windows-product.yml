# Native execution contract: independently pinned in the policy repository.
# No privileged credentials, shared build caches, or target-controlled acceptance.
name: Windows Product qualification
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - converted_to_draft
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR; dispatch on its current head branch. Always fresh native execution.
        required: true
        type: string
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: windows-product-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    name: Windows source and execution decision
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      source: ${{ steps.plan.outputs.source }}
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      pr: ${{ steps.plan.outputs.pr }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
    steps:
    - name: Checkout policy candidate
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Decide Windows execution
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        WINDOWS_PRODUCT_APP_ID: ${{ vars.WINDOWS_PRODUCT_APP_ID }}
      run: python3 scripts/windows_product_gate.py plan
  coordinate:
    name: Await exact-source authority on Ubuntu
    needs: plan
    if: needs.plan.outputs.mode == 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
    steps:
    - name: Checkout policy candidate
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Bounded authority coordination before allocating Windows
      id: authority
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SOURCE: ${{ needs.plan.outputs.source }}
        WINDOWS_PRODUCT_APP_ID: ${{ vars.WINDOWS_PRODUCT_APP_ID }}
      run: python3 scripts/windows_product_gate.py coordinate --wait-seconds 420
  verify:
    name: Verify Windows product
    if: needs.plan.outputs.mode == 'native' && needs.coordinate.outputs.mode == 'native'
    needs: [plan, coordinate]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: ${{ needs.plan.outputs.source }}
        fetch-depth: 0
        persist-credentials: false
    - name: Recheck after Windows slot
      id: slot
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SOURCE: ${{ needs.plan.outputs.source }}
        WINDOWS_PRODUCT_APP_ID: ${{ vars.WINDOWS_PRODUCT_APP_ID }}
      run: python scripts/windows_product_gate.py slot
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24
        cache: npm
      if: steps.slot.outputs.native == 'true'
    - name: Setup Rust 1.90
      shell: pwsh
      run: 'rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update

        rustup default 1.90.0

        '
      if: steps.slot.outputs.native == 'true'
    - name: Install dependencies
      run: npm ci
      if: steps.slot.outputs.native == 'true'
    - name: Check Rust formatting
      run: cargo fmt --all -- --check
      if: steps.slot.outputs.native == 'true'
    - name: Verify repository contract
      run: npm run verify:repo
      if: steps.slot.outputs.native == 'true'
    - name: Typecheck
      run: npm run typecheck
      if: steps.slot.outputs.native == 'true'
    - name: Visual Settings scroll and footer regression
      run: node scripts/verify-settings-render.mjs
      if: steps.slot.outputs.native == 'true'
    - name: Qualify bundled SQLite runtime
      run: cargo test -p mind-place-state bundled_sqlite_version_is_supported -- --nocapture
      if: steps.slot.outputs.native == 'true'
    - name: Test
      run: npm test
      if: steps.slot.outputs.native == 'true'
    - name: Stage capture sidecar for native desktop tests
      shell: pwsh
      run: 'cargo build -p mind-place-capture-host

        New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null

        Copy-Item "target/debug/mind-place-capture-host.exe" "src-tauri/binaries/mind-place-capture-host-x86_64-pc-windows-msvc.exe"

        node scripts/tunnel-helper.mjs

        node scripts/generate-notices.mjs

        npm run build:web

        '
      if: steps.slot.outputs.native == 'true'
    - name: Qualify Phase 3E simulated MCP and revocation boundary
      run: cargo test -p mind-place-integration --test mcp -- --nocapture
      if: steps.slot.outputs.native == 'true'
    - name: Test hosted tunnel desktop boundaries
      run: cargo test -p mind-place --bin mind-place hosted_tunnel::tests -- --nocapture
      if: steps.slot.outputs.native == 'true'
    - name: Qualify native capture encrypted IPC and revoked owner epoch
      if: steps.slot.outputs.native == 'true' && hashFiles('.github/workflows/mp9b-sqlcipher-qualification.yml') != ''
      shell: pwsh
      run: |
        # Without MP-9B the named native module is absent. With MP-9B, do not
        # let Cargo's successful zero-test filter masquerade as qualification.
        $listing = & cargo test -p mind-place --bin mind-place native_capture_ipc::qualification -- --list 2>&1
        if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate native encrypted IPC qualification' }
        foreach ($required in @(
          'native_capture_ipc::qualification::separate_process_capture_probe: test',
          'native_capture_ipc::qualification::owner_local_capture_roundtrip_requires_unlocked_epoch: test'
        )) {
          if (-not ($listing | Select-String -SimpleMatch $required)) { throw "Missing qualification: $required" }
        }
        cargo test -p mind-place --bin mind-place native_capture_ipc::qualification -- --nocapture
    - name: Build desktop app
      run: npm run build
      if: steps.slot.outputs.native == 'true'
    - name: Verify portable MIT license and third-party notices
      run: npm run verify:distribution-license
      if: steps.slot.outputs.native == 'true'
    - name: Record native proof
      if: steps.slot.outputs.native == 'true' && needs.plan.outputs.pr != '0'
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_SOURCE: ${{ needs.plan.outputs.source }}
      run: python scripts/windows_product_gate.py proof
    - name: Upload native proof
      if: steps.slot.outputs.native == 'true' && needs.plan.outputs.pr != '0'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-product-proof-${{ github.run_id }}-${{ github.run_attempt }}
        path: qualification/proof.json
        if-no-files-found: error
        retention-days: 14
    outputs:
      executed: ${{ steps.slot.outputs.native }}
  candidate:
    name: Windows Product / candidate result
    if: always()
    needs:
    - plan
    - coordinate
    - verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Report actual execution boundary
      env:
        PLAN: ${{ needs.plan.result }}
        MODE: ${{ needs.coordinate.outputs.mode || needs.plan.outputs.mode }}
        NATIVE: ${{ needs.verify.result }}
        EXECUTED: ${{ needs.verify.outputs.executed }}
        DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
      run: "if [ \"$DRAFT\" = true ]; then\n  echo 'PENDING: Draft native qualification' >> \"$GITHUB_STEP_SUMMARY\"\
        \nelif [ \"$PLAN\" != success ]; then\n  echo 'Source decision failed'; exit 1\nelif [ \"$MODE\" = reuse\
        \ ] || { [ \"$NATIVE\" = success ] && [ \"$EXECUTED\" = false ]; }; then\n  echo 'REUSE_CANDIDATE: independent\
        \ App acceptance is required' >> \"$GITHUB_STEP_SUMMARY\"\nelif [ \"$NATIVE\" = success ] && [ \"$EXECUTED\"\
        \ = true ]; then\n  echo 'NATIVE_EXECUTED: independent App acceptance is required' >> \"$GITHUB_STEP_SUMMARY\"\
        \nelse\n  echo 'Native qualification failed or skipped without proof'; exit 1\nfi"
