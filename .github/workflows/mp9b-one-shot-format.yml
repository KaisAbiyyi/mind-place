name: MP-9B one-shot formatter
on:
  push:
    branches: [feat/mp-9b-encrypted-vault-cloud-20261025]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain with rustfmt
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0
      - name: Apply fmt and publish minimal changed paths
        run: |
          cargo fmt --all
          git add crates/security-core/src/vault_storage.rs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(mp-9b): format vault object HMAC integrity changes"
            git push origin HEAD:feat/mp-9b-encrypted-vault-cloud-20261025
          fi
