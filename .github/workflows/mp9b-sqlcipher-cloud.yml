name: MP-9B SQLCipher cloud qualify
on:
  push:
    branches: [feat/mp-9b-encrypted-vault-cloud-20261025]
permissions:
  contents: write
jobs:
  linux-keyed-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0
      - name: Format and resolve lockfile
        run: |
          cargo fmt --all
          cargo check -p mind-place-state -p mind-place-index -p mind-place-security
      - name: Commit checked source and lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/state-core crates/index-core crates/security-core
          if ! git diff --cached --quiet; then
            git commit -m "chore(mp-9b): format keyed storage and resolve SQLCipher dependencies"
            git push origin HEAD:feat/mp-9b-encrypted-vault-cloud-20261025
          fi
      - name: Storage tests
        run: |
          cargo test -p mind-place-state -p mind-place-index -p mind-place-security --lib
