name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: Fast developer feedback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify repository contract
        run: npm run verify:repo
      - name: Typecheck
        run: npm run typecheck
      - name: Test reader and browser contracts
        run: npm run test:web
      - name: Build reader
        run: npm run build:web
      - name: Validate document qualification gate policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_mp10c_*.py' -q
      - name: Report draft acceptance boundary
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo '### Development checks only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full Windows product, security/native and storage qualification are PENDING for this Draft PR. A skipped native job does not certify acceptance. Switch to Ready for Review after freezing the candidate, or dispatch final qualification explicitly.' >> "$GITHUB_STEP_SUMMARY"

  rust-fast:
    name: Fast Rust compile and vault feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: mind-place-fast-rust-190
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Compile production core crates
        run: cargo check --locked -p mind-place-security -p mind-place-state -p mind-place-index -p mind-place-integration
      - name: Compile available SQLCipher and vault features
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          packages = {p["name"]: p["features"] for p in data["packages"]}
          for package, feature in (
              ("mind-place-state", "sqlcipher-preview"),
              ("mind-place-index", "sqlcipher-preview"),
              ("mind-place-integration", "vault-mcp"),
          ):
              if feature in packages.get(package, {}):
                  subprocess.run(["cargo", "check", "--locked", "-p", package,
                                  "--features", feature], check=True)
              else:
                  print(f"Feature {package}/{feature} absent at this source SHA; "
                        "normal core compilation remains mandatory")
          PY
      - name: Focused security tests
        run: cargo test --locked -p mind-place-security --lib

  verify:
    name: Verify Windows product
    # Drafts receive fast feedback above. Run the full native/security suite
    # when the PR becomes reviewable, on subsequent ready-PR pushes, on main,
    # or by explicit dispatch. This job remains the Windows acceptance signal.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: rust-fast
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: windows-product-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust 1.90
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify repository contract
        run: npm run verify:repo

      - name: Typecheck
        run: npm run typecheck

      - name: Visual Settings scroll and footer regression
        run: node scripts/verify-settings-render.mjs

      - name: Qualify bundled SQLite runtime
        run: cargo test -p mind-place-state bundled_sqlite_version_is_supported -- --nocapture

      - name: Test
        run: npm test

      - name: Stage capture sidecar for native desktop tests
        shell: pwsh
        run: |
          cargo build -p mind-place-capture-host
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item "target/debug/mind-place-capture-host.exe" "src-tauri/binaries/mind-place-capture-host-x86_64-pc-windows-msvc.exe"
          node scripts/tunnel-helper.mjs
          node scripts/generate-notices.mjs
          npm run build:web

      - name: Qualify Phase 3E simulated MCP and revocation boundary
        run: cargo test -p mind-place-integration --test mcp -- --nocapture

      - name: Test hosted tunnel desktop boundaries
        run: cargo test -p mind-place --bin mind-place hosted_tunnel::tests -- --nocapture

      - name: Build desktop app
        run: npm run build

      - name: Verify portable MIT license and third-party notices
        run: npm run verify:distribution-license


  native-evidence:
    name: Native execution evidence
    if: always() && github.event_name == 'pull_request'
    needs: [fast, rust-fast, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Capture native execution provenance
        run: python3 scripts/mp10c_native_contract.py attest --output qualification/native-contract.json
      - name: Upload native execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: mp-native-contract-attempt-${{ github.run_attempt }}
          path: qualification/native-contract.json
          if-no-files-found: error
          retention-days: 30
