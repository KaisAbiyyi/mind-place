name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows product
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust 1.90
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify repository contract
        run: npm run verify:repo

      - name: Typecheck
        run: npm run typecheck

      - name: Qualify bundled SQLite runtime
        run: cargo test -p mind-place-state bundled_sqlite_version_is_supported -- --nocapture

      - name: Test
        run: npm test

      - name: Stage capture sidecar for native desktop tests
        shell: pwsh
        run: |
          cargo build -p mind-place-capture-host
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $triple = (rustc -vV | Select-String '^host:\s*(.+)

      - name: Build desktop app
        run: npm run build
).Matches[0].Groups[1].Value.Trim()
          if (-not $triple) { throw 'Missing Rust target triple' }
          Copy-Item "target/debug/mind-place-capture-host.exe" "src-tauri/binaries/mind-place-capture-host-$triple.exe"

      - name: Test hosted tunnel desktop boundaries
        run: cargo test -p mind-place --bin mind-place hosted_tunnel::tests -- --nocapture

      - name: Build desktop app
        run: npm run build
