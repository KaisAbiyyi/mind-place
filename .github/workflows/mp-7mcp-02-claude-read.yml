name: MP-7MCP-02 Claude read cloud qualification
on:
  push:
    branches:
      - feat/mp-7mcp-02-claude-read-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-contract:
    name: Claude synthetic MCP read and revocation tests (not live client)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact cloud source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Exercise MCP wire and per-collection grant negative matrix
        run: cargo test --locked -p mind-place-integration --test mcp --test scopes -- --nocapture
      - name: Exercise full integration crate (dispatcher, clients, fences)
        run: cargo test --locked -p mind-place-integration
      - name: Exercise authoritative grant storage and client authority
        run: cargo test --locked -p mind-place-state --test read_scopes --test clients
      - name: Exercise encrypted-vault MCP path with scoped grants
        run: cargo test --locked -p mind-place-integration --features vault-mcp --test mcp_vault
      - name: Record truthful qualification boundary
        if: always()
        run: |
          echo "Synthetic MCP tests only. No actual Claude account/client or owner vault was connected." >> "$GITHUB_STEP_SUMMARY"
          echo "Per-client/per-collection grants are server-enforced in these synthetic tests; full MP-7MCP-02 acceptance remains blocked on the real Claude client and native owner gates." >> "$GITHUB_STEP_SUMMARY"
