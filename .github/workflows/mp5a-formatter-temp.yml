name: MP-5A Rustfmt (temporary)
on:
  push:
    branches: [feat/mp-5a-claim-history-20261023]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/mp-5a-claim-history-20261023'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mp-5a-claim-history-20261023
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonical cargo fmt
        run: cargo fmt --all
      - name: Commit bounded formatting
        shell: bash
        run: |
          if ! git diff --quiet -- crates/state-core; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- crates/state-core
            git commit -m "style(mp-5a): apply canonical Rust formatting"
            git push origin HEAD:feat/mp-5a-claim-history-20261023
          fi
