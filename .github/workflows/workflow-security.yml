name: GitHub Actions trust-boundary checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'docs/security/github-actions-fork-trust-boundaries.md'
      - 'scripts/verify-workflow-security.mjs'
      - 'test/workflow-security.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/security/github-actions-fork-trust-boundaries.md'
      - 'scripts/verify-workflow-security.mjs'
      - 'test/workflow-security.test.mjs'

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate workflow syntax with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Verify fork trust-boundary regression policy
        run: node scripts/verify-workflow-security.mjs
