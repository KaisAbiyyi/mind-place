name: MP-9B cloud checkout formatter
on:
  push:
    branches:
      - feat/mp-9b-encrypted-vault-cloud-20261025
permissions:
  contents: write
jobs:
  repair-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install pinned Rust toolchain and rustfmt
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0
      - name: Resolve dependencies and format Rust
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Test MP-9B security primitive
        run: cargo test -p mind-place-security --lib vault::tests -- --nocapture
      - name: Push reproducible formatting and lockfile to task branch only
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/security-core/src/lib.rs crates/security-core/src/vault.rs
          if ! git diff --cached --quiet; then
            git commit -m "chore(mp-9b): synchronize cloud Rust formatting and dependency lock"
            git push origin HEAD:feat/mp-9b-encrypted-vault-cloud-20261025
          fi
