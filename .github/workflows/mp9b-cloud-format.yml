name: MP-9B task formatter
on:
  push:
    branches: [feat/mp-9b-encrypted-vault-cloud-20261025]
permissions:
  contents: write
jobs:
  fmt-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0
      - name: Format and test synthetic vault
        run: |
          cargo fmt --all
          cargo test -p mind-place-security --lib vault::tests -- --nocapture
      - name: Commit formatter changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/security-core/src/vault.rs
          if ! git diff --cached --quiet; then
            git commit -m "chore(mp-9b): format reviewed vault guard changes"
            git push origin HEAD:feat/mp-9b-encrypted-vault-cloud-20261025
          fi
