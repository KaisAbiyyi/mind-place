name: CodeQL source analysis (read-only artifacts)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    # CodeQL is licensed for this public repository. Private clones require Code Security.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, python]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4, upstream resolved 2026-11-15
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          output: evidence/codeql
          upload: never
          upload-database: false
      - name: Require independent disposition and record committed-source provenance
        run: node scripts/supply-chain/sarif.mjs evidence/codeql
      - name: Retain SARIF and triage evidence for independent security review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/codeql/
          if-no-files-found: error
          retention-days: 14
  unsupported:
    name: CodeQL unsupported repository visibility
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: |
          echo 'BLOCKED: private clone requires explicit Code Security entitlement verification.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
