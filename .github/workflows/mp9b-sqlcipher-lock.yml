name: MP-9B SQLCipher dependency qualification
on:
  push:
    branches:
      - feat/mp-9b-encrypted-vault-cloud-20261025
permissions:
  contents: write
concurrency:
  group: mp9b-sqlcipher-lock-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustup default 1.90.0
      - name: Regenerate pinned lockfile from registry
        run: |
          cargo update -p rusqlite --precise 0.41.0
          cargo update -p libsqlite3-sys --precise 0.39.0
          cargo metadata --locked --no-deps > /dev/null
      - name: Commit exact resolved dependency lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(MP-9B): pin qualified SQLite and SQLCipher dependency lockfile"
          git push origin HEAD:feat/mp-9b-encrypted-vault-cloud-20261025
