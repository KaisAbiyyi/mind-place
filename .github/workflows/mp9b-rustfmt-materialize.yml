name: MP-9B cloud rustfmt materialization

on:
  push:
    branches:
      - feat/mp-9b-encrypted-vault-cloud-20261025

permissions:
  contents: read

jobs:
  rustfmt:
    name: Run cargo fmt and emit exact formatted sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0
      - name: Format and check the complete workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --stat
          mapfile -t changed < <(git diff --name-only -- '*.rs')
          printf 'RUSTFMT_CHANGED_FILES_BEGIN\n'
          printf '%s\n' "${changed[@]}"
          printf 'RUSTFMT_CHANGED_FILES_END\n'
          for path in "${changed[@]}"; do
            printf 'RUSTFMT_FILE_BEGIN:%s\n' "$path"
            base64 -w0 "$path"
            printf '\nRUSTFMT_FILE_END:%s\n' "$path"
          done
