name: MP-UI2 Shell Cloud Visual

on:
  pull_request:
    paths:
      - 'src/ui2/**'
      - 'src/app.ts'
      - 'test/ui2-shell.test.ts'
      - 'scripts/ui2-shell-visual.mjs'
      - '.github/workflows/ui2-shell-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Shell v2 visual, responsive, keyboard and language qualification
        run: node scripts/ui2-shell-visual.mjs
      - name: Save Shell v2 screenshots and gap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui2-shell-visual-${{ github.sha }}
          path: docs/ui/evidence/mp-ui2/shell/
          if-no-files-found: warn
          retention-days: 14
