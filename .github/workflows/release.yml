name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust 1.90
        shell: pwsh
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.90.0

      - name: Install dependencies
        run: npm ci

      - name: Verify and test
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          npm run typecheck
          npm test

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Build installer and portable package
        run: npm run dist:win

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assetDir = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $installer = Get-ChildItem 'target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }

          $setupName = "Mind-Place-v$version-windows-x64-setup.exe"
          $portableName = "Mind-Place-v$version-windows-x64-portable.zip"
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $assetDir $setupName)
          Compress-Archive -Path 'release/win32-x64/*' -DestinationPath (Join-Path $assetDir $portableName)

          Get-ChildItem $assetDir -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $assetDir 'SHA256SUMS.txt')

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mind-place-windows-${{ steps.assets.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
