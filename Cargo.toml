[workspace]
members = ["crates/archive-core", "crates/capture-host", "src-tauri"]
default-members = ["crates/archive-core", "crates/capture-host"]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2.5"
fs2 = "0.4"
tempfile = "3.23"
thiserror = "2.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
